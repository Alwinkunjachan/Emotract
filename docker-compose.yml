# version: '3.8'
services:

  # MongoDB Database
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # React Frontend Service (User)
  user:
    build:
      context: ./user
    ports:
      - "5173:5173"  # Default Vite port
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=5173
      - VITE_BACKEND_URL=http://localhost:5001
      - VITE_AUTH0_DOMAIN=emotract-test.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=rnsP4EG9QQpm2jHlaWMum5LFjtc90j83
      - VITE_AUTH0_AUDIENCE=https://api.emotract.com
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--port", "5173"]
    working_dir: /app
    volumes:
    - ./user/src:/app/src

  # React Frontend Service (Admin)
  admin:
    build:
      context: ./admin
    ports:
      - "5174:5174"  # Separate port for Admin Vite
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=5174
      - VITE_BACKEND_URL=http://localhost:5001
      - VITE_AUTH0_DOMAIN=emotract-test.us.auth0.com
      - VITE_AUTH0_CLIENT_ID=rnsP4EG9QQpm2jHlaWMum5LFjtc90j83
      - VITE_AUTH0_AUDIENCE=https://api.emotract.com
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--port", "5174"]
    working_dir: /app
    volumes:
      - ./admin/src:/app/src

  # Express Backend Service
  backend:
    build:
      context: ./server
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules
    command: ["npm", "start"]
    working_dir: /app


volumes:
  mongo_data:
