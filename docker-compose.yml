# version: '3.8'
services:

  # MongoDB Database
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # React Frontend Service (User)
  user:
    build:
      context: ./user
    ports:
      - "5173:5173"  # Default Vite port
    environment:
      - CHOKIDAR_USEPOLLING=true # create-ui-app <= 5.x
      - WATCHPACK_POLLING=true # create-ui-app >= 5.x
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=5173 # The mapped port on your host machine
      - VITE_BACKEND_URL=http://localhost:5001
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--port", "5173"]  # Run the dev server
    working_dir: /app  # Set the working directory to /app
    volumes:
    - ./user/src:/app/src

  # React Frontend Service (Admin)
  admin:
    build:
      context: ./admin
    ports:
      - "5174:5174"  # Separate port for Admin Vite
    environment:
      - CHOKIDAR_USEPOLLING=true # create-ui-app <= 5.x
      - WATCHPACK_POLLING=true # create-ui-app >= 5.x
      - FAST_REFRESH=false
      - WDS_SOCKET_PORT=5174
      - VITE_BACKEND_URL=http://localhost:5001
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--port", "5174"]  # Run the dev server
    working_dir: /app  # Set the working directory to /app
    volumes:
      - ./admin/src:/app/src

    # Express Backend Service
  backend:
    build:
      context: ./server
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
    depends_on:
      - mongo
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    command: ["npm", "start"]
    working_dir: /app


volumes:
  mongo_data:
  redis_data:
